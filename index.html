<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
  "https://lumio-backend-1-i6a3.onrender.com";

const TCHOTCHOM_PAYMENT_URL =
  "https://tchotchom.com/dDL1O43u09V40aYmtcVHrzsekuUletIY8vmKYicZ5KU";

let token =
  localStorage.getItem("lumio_token") || "";

let currentUser = null;

let eventsData = [];
let notesData = [];

let registerMode = true;


/* =====================================================
   UTILITAIRES
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showError(message){

  const box =
    document.getElementById("error");

  if(box){
    box.textContent =
      message || "";
  }

}


function formatMoney(value){

  return Number(value || 0)
    .toLocaleString("fr-FR",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }) + " HTG";

}


/* =====================================================
   API
===================================================== */

async function api(path,options={}){

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(token){

    headers.Authorization =
      "Bearer " + token;

  }

  let response;

  try{

    response =
      await fetch(
        API_URL + path,
        {
          ...options,
          headers
        }
      );

  }catch(error){

    throw new Error(
      "Impossible de contacter le serveur Lumio."
    );

  }

  let data;

  try{

    data =
      await response.json();

  }catch{

    data = {
      success:false,
      error:"Réponse serveur invalide."
    };

  }

  if(response.status === 401){

    clearSession();

    throw new Error(
      "Votre session a expiré. Connectez-vous à nouveau."
    );

  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      "Erreur serveur."
    );

  }

  return data;

}


/* =====================================================
   GESTION SESSION
===================================================== */

function clearSession(){

  token = "";
  currentUser = null;

  localStorage.removeItem(
    "lumio_token"
  );

}


function showAuth(){

  document
    .getElementById("app")
    ?.classList
    .add("hidden");

  document
    .getElementById("auth")
    ?.classList
    .remove("hidden");

}


function showApplication(){

  document
    .getElementById("auth")
    ?.classList
    .add("hidden");

  document
    .getElementById("app")
    ?.classList
    .remove("hidden");

}


/* =====================================================
   AUTHENTIFICATION
===================================================== */

const authForm =
  document.getElementById("authForm");

const authTitle =
  document.getElementById("authTitle");

const authSubmit =
  document.getElementById("authSubmit");

const switchMode =
  document.getElementById("switchMode");

const switchText =
  document.getElementById("switchText");


if(switchMode){

  switchMode.addEventListener(
    "click",
    function(){

      registerMode =
        !registerMode;

      showError("");

      if(registerMode){

        authTitle.textContent =
          "Bienvenue sur Lumio";

        authSubmit.textContent =
          "Créer mon compte";

        switchText.textContent =
          "Vous avez déjà un compte ?";

        switchMode.textContent =
          "Se connecter";

        document
          .getElementById("password")
          .autocomplete =
          "new-password";

      }else{

        authTitle.textContent =
          "Bon retour sur Lumio";

        authSubmit.textContent =
          "Se connecter";

        switchText.textContent =
          "Vous n'avez pas encore un compte ?";

        switchMode.textContent =
          "Créer un compte";

        document
          .getElementById("password")
          .autocomplete =
          "current-password";

      }

    }
  );

}


if(authForm){

  authForm.addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      showError("");

      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById("password")
          .value;

      if(!email || !password){

        showError(
          "Veuillez remplir tous les champs."
        );

        return;

      }

      if(password.length < 6){

        showError(
          "Le mot de passe doit contenir au moins 6 caractères."
        );

        return;

      }

      authSubmit.disabled = true;

      authSubmit.textContent =
        registerMode
          ? "Création..."
          : "Connexion...";

      try{

        const endpoint =
          registerMode
            ? "/api/auth/register"
            : "/api/auth/login";

        const data =
          await api(
            endpoint,
            {
              method:"POST",
              body:JSON.stringify({
                email,
                password
              })
            }
          );

        if(!data || !data.token){

          throw new Error(
            data?.error ||
            data?.message ||
            "Le serveur n'a pas envoyé de token."
          );

        }

        token =
          data.token;

        localStorage.setItem(
          "lumio_token",
          token
        );

        currentUser =
          data.user ||
          data.data?.user ||
          null;

        document
          .getElementById("password")
          .value = "";

        await openApp();

      }catch(error){

        console.error(
          "AUTH ERROR:",
          error
        );

        showError(
          error?.message ||
          "Impossible de créer le compte. Vérifiez les informations et réessayez."
        );

      }finally{

        authSubmit.disabled = false;

        authSubmit.textContent =
          registerMode
            ? "Créer mon compte"
            : "Se connecter";

      }

    }
  );

}


/* =====================================================
   OUVRIR L'APPLICATION
===================================================== */

async function openApp(){

  if(!token){

    showAuth();

    return;

  }

  showApplication();

  try{

    const me =
      await api(
        "/api/auth/me"
      );

    currentUser =
      me?.user ||
      me?.data?.user ||
      me?.data ||
      me ||
      currentUser;

  }catch(error){

    console.error(
      "Erreur profil:",
      error
    );

    /*
      Si le token est invalide,
      on retourne proprement
      à l'inscription.
    */

    clearSession();

    showAuth();

    showError(
      "Votre session n'est plus valide. Veuillez vous reconnecter."
    );

    return;

  }

  const userEmail =
    document.getElementById(
      "userEmail"
    );

  if(userEmail){

    userEmail.textContent =
      currentUser?.email || "";

  }

  await loadAll();

}

/* =====================================================
   NAVIGATION
===================================================== */

function showPage(pageId,button){

  document
    .querySelectorAll(".page")
    .forEach(function(page){

      page.classList.remove("active");

    });

  const page =
    document.getElementById(pageId);

  if(page){

    page.classList.add("active");

  }

  document
    .querySelectorAll(".nav-btn")
    .forEach(function(btn){

      btn.classList.remove("active");

    });

  if(button){

    button.classList.add("active");

  }else{

    document
      .querySelectorAll(".nav-btn")
      .forEach(function(btn){

        const onclick =
          btn.getAttribute("onclick") || "";

        if(
          onclick.includes(
            "'" + pageId + "'"
          )
        ){

          btn.classList.add("active");

        }

      });

  }

}

async function loadTasks(){

  try{

    const data =
      await api("/api/tasks");

    tasksData =
      data?.tasks ||
      data?.data ||
      [];

    if(!Array.isArray(tasksData)){

      tasksData = [];

    }

    renderTasks();

  }catch(error){

    console.error(
      "Erreur tâches:",
      error
    );

    tasksData = [];

    renderTasks(
      "Impossible de charger les tâches."
    );

  }

}


function renderTasks(errorMessage = ""){

  const list =
    document.getElementById(
      "tasksList"
    );

  if(!list) return;

  if(errorMessage){

    list.innerHTML =
      `<div class="empty">
        ${escapeHTML(errorMessage)}
      </div>`;

    return;

  }

  if(!tasksData.length){

    list.innerHTML =
      `<div class="empty">
        Aucune tâche pour le moment.
      </div>`;

    return;

  }

  list.innerHTML =
    tasksData
      .map(function(task){

        const priority =
          task.priority || "medium";

        const priorityLabel =
          priority === "high"
            ? "Haute"
            : priority === "low"
              ? "Faible"
              : "Moyenne";

        return `
          <div class="item">

            <div class="item-main">

              <div
                class="item-title"
                style="${
                  task.completed
                    ? "text-decoration:line-through;opacity:.6;"
                    : ""
                }"
              >
                ${escapeHTML(task.title)}
              </div>

              <div class="item-small">
                Priorité : ${priorityLabel}
              </div>

            </div>

            <div class="item-actions">

              <button
                class="${
                  task.completed
                    ? "orange"
                    : "success"
                }"
                onclick="toggleTask(
                  ${Number(task.id)},
                  ${!task.completed}
                )"
              >
                ${
                  task.completed
                    ? "Annuler"
                    : "Terminer"
                }
              </button>

              <button
                class="danger"
                onclick="deleteTask(
                  ${Number(task.id)}
                )"
              >
                Supprimer
              </button>

            </div>

          </div>
        `;

      })
      .join("");

}

/* =====================================================
   BUDGET
===================================================== */

async function loadBudget(){

  try{

    const data =
      await api("/api/budget");

    budgetData =
      data?.budget ||
      data?.data ||
      [];

    if(!Array.isArray(budgetData)){

      budgetData = [];

    }

    renderBudget();

  }catch(error){

    console.error(
      "Erreur budget:",
      error
    );

    budgetData = [];

    renderBudget(
      "Impossible de charger le budget."
    );

  }

}


function renderBudget(errorMessage = ""){

  const list =
    document.getElementById(
      "budgetList"
    );

  if(!list) return;

  if(errorMessage){

    list.innerHTML =
      `<div class="empty">
        ${escapeHTML(errorMessage)}
      </div>`;

    return;

  }

  let income = 0;
  let expense = 0;

  budgetData.forEach(function(item){

    const amount =
      Number(item.amount || 0);

    if(item.type === "income"){

      income += amount;

    }else{

      expense += amount;

    }

  });

  const balance =
    income - expense;

  const balanceElement =
    document.getElementById(
      "budgetBalance"
    );

  if(balanceElement){

    balanceElement.textContent =
      formatMoney(balance);

    balanceElement.className =
      "balance " +
      (
        balance >= 0
          ? "income"
          : "expense"
          
      );

  }

  const summary =
    document.getElementById(
      "budgetSummary"
    );

  if(summary){

    summary.textContent =
      `Revenus : ${formatMoney(income)} — Dépenses : ${formatMoney(expense)}`;

  }

  if(!budgetData.length){

    list.innerHTML =
      `<div class="empty">
        Aucune opération pour le moment.
      </div>`;

    return;

  }

  list.innerHTML =
    budgetData
      .map(function(item){

        const amount =
          Number(item.amount || 0);

        const isIncome =
          item.type === "income";

        return `
          <div class="item">

            <div class="item-main">

              <div class="item-title">
                ${escapeHTML(
                  item.description || ""
                )}
              </div>

              <div class="item-small">
                ${
                  isIncome
                    ? "Revenu"
                    : "Dépense"
                }
              </div>

            </div>

            <div class="item-actions">

              <strong
                class="${
                  isIncome
                    ? "income"
                    : "expense"
                }"
              >
                ${
                  isIncome
                    ? "+"
                    : "-"
                }${formatMoney(amount)}
              </strong>

              <button
                class="danger"
                onclick="deleteBudget(${Number(item.id)})"
              >
                Supprimer
              </button>

            </div>

          </div>
        `;

      })
      .join("");

}

/* =====================================================
   OBJECTIFS
===================================================== */

async function loadGoals(){

  try{

    const data =
      await api("/api/goals");

    goalsData =
      data?.goals ||
      data?.data ||
      [];

    if(!Array.isArray(goalsData)){

      goalsData = [];

    }

    renderGoals();

  }catch(error){

    console.error(
      "Erreur objectifs:",
      error
    );

    goalsData = [];

    renderGoals(
      "Impossible de charger les objectifs."
    );

  }

}


function renderGoals(errorMessage = ""){

  const list =
    document.getElementById(
      "goalsList"
    );

  if(!list) return;

  if(errorMessage){

    list.innerHTML =
      `<div class="empty">
        ${escapeHTML(errorMessage)}
      </div>`;

    return;

  }

  if(!goalsData.length){

    list.innerHTML =
      `<div class="empty">
        Aucun objectif pour le moment.
      </div>`;

    return;

  }

  list.innerHTML =
    goalsData
      .map(function(goal){

        const target =
          Number(goal.target || 0);

        const progress =
          Number(goal.progress || 0);

        const percent =
          target > 0
            ? Math.min(
                100,
                Math.round(
                  progress / target * 100
                )
              )
            : 0;

        const nextProgress =
          Math.min(
            progress + 1,
            target
          );

        return `
          <div class="item">

            <div class="item-main">

              <div class="item-title">
                ${escapeHTML(
                  goal.title || ""
                )}
              </div>

              <div class="item-small">
                Progression :
                ${progress} / ${target}
              </div>

              <div class="progress">

                <div
                  class="progress-bar"
                  style="width:${percent}%"
                ></div>

              </div>

            </div>

            <div class="item-actions">

              <button
                class="success"
                onclick="increaseGoal(
                  ${Number(goal.id)},
                  ${nextProgress}
                )"
                ${
                  progress >= target
                    ? "disabled"
                    : ""
                }
              >
                +1
              </button>

              <button
                class="danger"
                onclick="deleteGoal(
                  ${Number(goal.id)}
                )"
              >
                Supprimer
              </button>

            </div>

          </div>
        `;

      })
      .join("");

}


async function addGoal(){

  const title =
    document
      .getElementById("goalTitle")
      .value
      .trim();

  const target =
    Number(
      document
        .getElementById("goalTarget")
        .value
    );

  if(!title){

    alert(
      "Veuillez entrer le nom de l'objectif."
    );

    return;

  }

  if(!target || target <= 0){

    alert(
      "Veuillez entrer une cible valide."
    );

    return;

  }

  try{

    await api(
      "/api/goals",
      {
        method:"POST",
        body:JSON.stringify({
          title,
          target
        })
      }
    );

    document
      .getElementById("goalTitle")
      .value = "";

    document
      .getElementById("goalTarget")
      .value = "";

    await loadGoals();

    updateDashboard();

  }catch(error){

    alert(
      error.message ||
      "Impossible de créer l'objectif."
    );

  }

}


async function increaseGoal(
  id,
  progress
){

  try{

    await api(
      `/api/goals/${id}`,
      {
        method:"PATCH",
        body:JSON.stringify({
          progress
        })
      }
    );

    await loadGoals();

    updateDashboard();

  }catch(error){

    alert(
      error.message ||
      "Impossible de modifier l'objectif."
    );

  }

}


async function deleteGoal(id){

  if(!confirm(
    "Supprimer cet objectif ?"
  )) return;

  try{

    await api(
      `/api/goals/${id}`,
      {
        method:"DELETE"
      }
    );

    await loadGoals();

    updateDashboard();

  }catch(error){

    alert(
      error.message ||
      "Impossible de supprimer l'objectif."
    );

  }

}


/* =====================================================
   FOCUS TIMER
===================================================== */

let timerSeconds = 25 * 60;
let timerInterval = null;
let timerRunning = false;


function updateTimerDisplay(){

  const timer =
    document.getElementById(
      "timer"
    );

  if(!timer) return;

  const minutes =
    Math.floor(
      timerSeconds / 60
    );

  const seconds =
    timerSeconds % 60;

  timer.textContent =
    String(minutes).padStart(2,"0") +
    ":" +
    String(seconds).padStart(2,"0");

}


function startTimer(){

  if(timerRunning) return;

  timerRunning = true;

  timerInterval =
    setInterval(
      function(){

        if(timerSeconds > 0){

          timerSeconds--;

          updateTimerDisplay();

        }else{

          clearInterval(
            timerInterval
          );

          timerInterval = null;
          timerRunning = false;

          alert(
            "Session Focus terminée."
          );

        }

      },
      1000
    );

}


function pauseTimer(){

  if(timerInterval){

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

  timerRunning = false;

}


function resetTimer(){

  pauseTimer();

  timerSeconds =
    25 * 60;

  updateTimerDisplay();

}


/* =====================================================
   PREMIUM
===================================================== */

const PREMIUM_AMOUNT = 250;

function loadSubscription(){

  return new Promise(
    async function(resolve){

      try{

        const data =
          await api(
            "/api/subscription/status"
          );

        const premium =
          data?.premium === true ||
          data?.isPremium === true ||
          data?.status === "active" ||
          data?.subscription?.status === "active";

        updatePremiumUI(
          premium
        );

      }catch(error){

        console.warn(
          "Statut Premium indisponible:",
          error.message
        );

        updatePremiumUI(false);

      }

      resolve();

    }
  );

}


function updatePremiumUI(isPremium){

  const badge =
    document.getElementById(
      "premiumBadge"
    );

  const status =
    document.getElementById(
      "premiumStatus"
    );

  const button =
    document.getElementById(
      "premiumButton"
    );

  if(isPremium){

    if(badge){

      badge.classList.remove(
        "hidden"
      );

    }

    if(status){

      status.textContent =
        "Votre compte bénéficie actuellement de Lumio Premium.";

    }

    if(button){

      button.textContent =
        "Premium activé";

      button.disabled = true;

    }

  }else{

    if(badge){

      badge.classList.add(
        "hidden"
      );

    }

    if(status){

      status.textContent =
        "Votre compte utilise actuellement Lumio Free.";

    }

    if(button){

      button.textContent =
        `Activer Premium — ${PREMIUM_AMOUNT} HTG`;

      button.disabled = false;

    }

  }

}


/*
  Paiement simplifié :

  Nous n'utilisons plus la route API
  de paiement Premium.

  L'utilisateur est envoyé directement
  vers le lien Tchotchom configuré.
*/

function createPremiumPayment(){

  if(!token){

    showAuth();

    showError(
      "Veuillez créer un compte ou vous connecter avant d'activer Premium."
    );

    return;

  }

  const amount =
    PREMIUM_AMOUNT;

  const result =
    document.getElementById(
      "paymentResult"
    );

  if(result){

    result.className =
      "message show ok";

    result.textContent =
      `Vous allez être redirigé vers Tchotchom pour payer ${amount} HTG.`;

  }

  setTimeout(
    function(){

      window.location.href =
        TCHOTCHOM_PAYMENT_URL;

    },
    700
  );

}
